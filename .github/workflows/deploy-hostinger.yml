name: Deploy CASA to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'site/var/www/html/**'
      - '.github/workflows/deploy-hostinger.yml'

permissions:
  contents: read

env:
  HOSTINGER_SSH_HOST: 185.211.7.4
  HOSTINGER_SSH_PORT: '65002'
  HOSTINGER_SSH_USER: u820932905
  CASA_BASE_URL: https://maurinsoft.com.br/casa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH client tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

      - name: Configure SSH authentication
        id: sshauth
        shell: bash
        env:
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${HOSTINGER_SSH_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy"
            chmod 600 "$HOME/.ssh/hostinger_deploy"
            echo "mode=key" >> "$GITHUB_OUTPUT"
            echo "SSH de deploy configurado por chave privada."
            exit 0
          fi

          if [ -n "${HOSTINGER_SSH_PASSWORD:-}" ]; then
            echo "mode=password" >> "$GITHUB_OUTPUT"
            echo "SSH de deploy configurado por senha."
            exit 0
          fi

          echo "::error title=Credencial SSH ausente::Configure HOSTINGER_SSH_PRIVATE_KEY (recomendado) ou HOSTINGER_SSH_PASSWORD em Settings > Secrets and variables > Actions."
          exit 1

      - name: Prepare web package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-hostinger
          mkdir -p deploy-hostinger
          cp -a site/var/www/html/. deploy-hostinger/
          # Production credentials stay only on the Hostinger server.
          rm -f deploy-hostinger/api/config.local.php

      - name: Discover Hostinger CASA directory
        id: remote
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_AUTH_MODE: ${{ steps.sshauth.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SSH_AUTH_MODE" = "key" ]; then
            SSH="ssh -i $HOME/.ssh/hostinger_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          else
            SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          fi

          REMOTE_PATH="$($SSH "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" 'bash -s' <<'EOS'
          set -e
          candidates=(
            "$HOME/domains/maurinsoft.com.br/public_html/casa"
            "$HOME/public_html/casa"
          )

          for p in "${candidates[@]}"; do
            parent="$(dirname "$p")"
            if [ -d "$parent" ]; then
              mkdir -p "$p"
              printf '%s\n' "$p"
              exit 0
            fi
          done

          root="$(find "$HOME" -maxdepth 5 -type d -path '*/maurinsoft.com.br/public_html' 2>/dev/null | head -n 1)"
          if [ -n "$root" ]; then
            mkdir -p "$root/casa"
            printf '%s\n' "$root/casa"
            exit 0
          fi

          echo "Nao foi possivel localizar o public_html de maurinsoft.com.br" >&2
          exit 1
          EOS
          )"

          test -n "$REMOTE_PATH"
          echo "path=$REMOTE_PATH" >> "$GITHUB_OUTPUT"
          echo "Diretorio CASA localizado: $REMOTE_PATH"

      - name: Ensure private production config
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_AUTH_MODE: ${{ steps.sshauth.outputs.mode }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
          CASA_DB_PASSWORD: ${{ secrets.CASA_DB_PASSWORD }}
          CASA_SYSTEM_API_TOKEN: ${{ secrets.CASA_SYSTEM_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REMOTE_PATH"
          if [ "$SSH_AUTH_MODE" = "key" ]; then
            SSH="ssh -i $HOME/.ssh/hostinger_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          else
            SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          fi

          if $SSH "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "test -s '$REMOTE_PATH/api/config.local.php'"; then
            echo "config.local.php privado encontrado no servidor; sera preservado."
            exit 0
          fi

          if [ -z "${CASA_DB_PASSWORD:-}" ]; then
            echo "ERRO: $REMOTE_PATH/api/config.local.php nao existe e o secret CASA_DB_PASSWORD nao foi configurado." >&2
            echo "Crie o arquivo privado no servidor ou configure o secret CASA_DB_PASSWORD antes de publicar." >&2
            exit 1
          fi

          DB_B64="$(printf '%s' "$CASA_DB_PASSWORD" | base64 -w0)"
          TOKEN_B64="$(printf '%s' "${CASA_SYSTEM_API_TOKEN:-}" | base64 -w0)"

          $SSH "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" bash -s -- "$REMOTE_PATH" "$DB_B64" "$TOKEN_B64" <<'EOS'
          set -euo pipefail
          REMOTE_PATH="$1"
          DB_PASS="$(printf '%s' "$2" | base64 -d)"
          API_TOKEN="$(printf '%s' "$3" | base64 -d)"
          mkdir -p "$REMOTE_PATH/api"
          umask 077
          php -r '
            $path=$argv[1];
            $dbPass=$argv[2];
            $apiToken=$argv[3];
            $cfg=[
              "db_host"=>"localhost",
              "db_port"=>"3306",
              "db_name"=>"u820932905_casadb",
              "db_user"=>"u820932905_root",
              "db_pass"=>$dbPass,
              "db_charset"=>"utf8mb4",
              "auto_init_db"=>true,
              "system_api_token"=>$apiToken
            ];
            file_put_contents($path, "<?php\nreturn ".var_export($cfg,true).";\n");
          ' "$REMOTE_PATH/api/config.local.php" "$DB_PASS" "$API_TOKEN"
          chmod 600 "$REMOTE_PATH/api/config.local.php" || true
          EOS

          echo "config.local.php privado criado a partir dos GitHub Secrets."

      - name: Deploy CASA web files
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_AUTH_MODE: ${{ steps.sshauth.outputs.mode }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$REMOTE_PATH"

          if [ "$SSH_AUTH_MODE" = "key" ]; then
            RSYNC_SSH="ssh -i $HOME/.ssh/hostinger_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          else
            RSYNC_SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          fi

          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='api/config.local.php' \
            -e "$RSYNC_SSH" \
            deploy-hostinger/ \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$REMOTE_PATH/"

      - name: Verify deployed files and private config
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_AUTH_MODE: ${{ steps.sshauth.outputs.mode }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$SSH_AUTH_MODE" = "key" ]; then
            SSH="ssh -i $HOME/.ssh/hostinger_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          else
            SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"
          fi
          $SSH "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "test -f '$REMOTE_PATH/index.php' && test -f '$REMOTE_PATH/info.php' && test -d '$REMOTE_PATH/api' && test -s '$REMOTE_PATH/api/config.local.php'"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$CASA_BASE_URL/" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$CASA_BASE_URL/info.php" >/dev/null
          echo "CASA publicado em $CASA_BASE_URL/"
