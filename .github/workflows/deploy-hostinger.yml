name: Deploy CASA to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'site/var/www/html/**'
      - '.github/workflows/deploy-hostinger.yml'

permissions:
  contents: read

env:
  HOSTINGER_SSH_HOST: 185.211.7.4
  HOSTINGER_SSH_PORT: '65002'
  HOSTINGER_SSH_USER: u820932905
  CASA_DOMAIN: casa.maurinsoft.com.br

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH password client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: Prepare web package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-hostinger
          mkdir -p deploy-hostinger
          cp -a site/var/www/html/. deploy-hostinger/
          # Production credentials stay only on the Hostinger server.
          rm -f deploy-hostinger/api/config.local.php

      - name: Discover Hostinger document root
        id: remote
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"

          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT"

          REMOTE_PATH="$($SSH "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" 'bash -s' <<'EOS'
          set -e
          DOMAIN="casa.maurinsoft.com.br"

          candidates=(
            "$HOME/domains/$DOMAIN/public_html"
            "$HOME/domains/maurinsoft.com.br/public_html/casa"
            "$HOME/public_html"
          )

          for p in "${candidates[@]}"; do
            if [ -d "$p" ]; then
              printf '%s\n' "$p"
              exit 0
            fi
          done

          found="$(find "$HOME" -maxdepth 5 -type d \( -path "*/$DOMAIN/public_html" -o -path "*/public_html/casa" \) 2>/dev/null | head -n 1)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            exit 0
          fi

          echo "Nao foi possivel localizar o document root de $DOMAIN" >&2
          exit 1
          EOS
          )"

          test -n "$REMOTE_PATH"
          echo "path=$REMOTE_PATH" >> "$GITHUB_OUTPUT"
          echo "Document root localizado."

      - name: Deploy web files only
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          test -n "$REMOTE_PATH"

          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='api/config.local.php' \
            -e "sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $HOSTINGER_SSH_PORT" \
            deploy-hostinger/ \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$REMOTE_PATH/"

      - name: Verify deployed files
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "test -f '$REMOTE_PATH/index.php' && test -d '$REMOTE_PATH/api'"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "https://$CASA_DOMAIN/" >/dev/null
          echo "CASA publicado em https://$CASA_DOMAIN"
