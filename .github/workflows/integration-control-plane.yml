name: Integration Control Plane

on:
  push:
    paths:
      - 'site/var/www/html/api/**'
      - 'database/**'
      - 'mysql/**'
      - 'site/var/www/html/automacao.php'
      - 'servicos/device_simulator.py'
      - 'servicos/arm-agent/**'
      - 'android/**'
      - 'arduino/**'
      - 'yocto/**'
      - '.github/tests/**'
      - '.github/workflows/integration-control-plane.yml'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: casa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      JARVIS_DB_HOST: 127.0.0.1
      JARVIS_DB_PORT: 3306
      JARVIS_DB_NAME: casa_test
      JARVIS_DB_USER: root
      JARVIS_DB_PASS: root
      JARVIS_AUTO_INIT_DB: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,curl,json

      - name: Validate PHP syntax
        shell: bash
        run: |
          find site/var/www/html/api -name '*.php' -print0 | xargs -0 -n1 php -l
          find .github/tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l site/var/www/html/automacao.php

      - name: Enforce API v1 on external clients
        run: python3 .github/tests/test_api_v1_clients.py

      - name: Validate database domains
        run: python3 .github/tests/test_database_domains.py

      - name: Validate Android mobile architecture
        run: python3 .github/tests/test_android_mobile_architecture.py

      - name: Enforce universal task context
        run: python3 .github/tests/test_task_context_contract.py

      - name: Test automatic empty-database install
        run: php .github/tests/test_schema_install.php

      - name: Test Command Bus and automation internals
        run: php .github/tests/test_control_plane.php

      - name: Test Control Plane HTTP end-to-end
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t site/var/www/html >/tmp/casa-control-plane-php.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8099/api/v1/health.php >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/casa-control-plane-php.log
              exit 1
            fi
            sleep 1
          done

          CONTROL_PLANE_BASE_URL=http://127.0.0.1:8099/api/v1 php .github/tests/test_control_plane_http.php || {
            cat /tmp/casa-control-plane-php.log
            exit 1
          }

      - name: Validate simulator syntax
        run: python3 -m py_compile servicos/device_simulator.py
