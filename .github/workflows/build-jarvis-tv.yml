name: Build Jarvis TV APK

on:
  push:
    paths:
      - 'android/JarvisTV/**'
      - '.github/workflows/build-jarvis-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/JarvisTV

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          VERSAO=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "../../JarvisTV-v${VERSAO}-debug.apk"

      # So grava o APK no repositorio quando o build roda na master: em outros
      # ramos (codigo ainda em revisao) o APK fica apenas como artefato.
      - name: Version APK in repository
        if: github.ref == 'refs/heads/master'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          cp "JarvisTV-v${VERSAO}-debug.apk" "/tmp/JarvisTV-v${VERSAO}-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --hard origin/master
          mkdir -p bin/android-tv
          cp "/tmp/JarvisTV-v${VERSAO}-debug.apk" "bin/android-tv/JarvisTV-v${VERSAO}-debug.apk"
          cp "/tmp/JarvisTV-v${VERSAO}-debug.apk" bin/android-tv/JarvisTV-debug.apk
          git add bin/android-tv/
          if git diff --cached --quiet; then
            echo "APK sem alteracoes."
          else
            git commit -m "Atualiza APK Jarvis TV v${VERSAO} [skip ci]"
            git push origin HEAD:master
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisTV-v${{ env.VERSAO }}-debug-apk
          path: JarvisTV-v${{ env.VERSAO }}-debug.apk
          if-no-files-found: error
