name: Build Jarvis TV APK

on:
  push:
    paths:
      - 'android/JarvisTV/**'
      - '.github/workflows/build-jarvis-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/JarvisTV

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Detect version from Gradle
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "../../JarvisTV-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisTV-v${{ steps.version.outputs.name }}-debug-apk
          path: JarvisTV-v${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
