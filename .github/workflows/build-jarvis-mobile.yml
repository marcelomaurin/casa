name: Build Jarvis Mobile APK

on:
  push:
    paths:
      - 'android/JarvisMobile/**'
      - '.github/workflows/build-jarvis-mobile.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/JarvisMobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Patch Compose for Kotlin 2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('build.gradle.kts')
          txt = root.read_text()
          if 'org.jetbrains.kotlin.plugin.compose' not in txt:
              txt = txt.replace(
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
              )
              root.write_text(txt)

          app = Path('app/build.gradle.kts')
          txt = app.read_text()
          if 'id("org.jetbrains.kotlin.plugin.compose")' not in txt:
              txt = txt.replace(
                  'id("org.jetbrains.kotlin.android")',
                  'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
              )
          txt = txt.replace('''\n    composeOptions {\n        kotlinCompilerExtensionVersion = "1.5.15"\n    }\n''', '\n')
          app.write_text(txt)
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../../JarvisMobile-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisMobile-debug-apk
          path: JarvisMobile-debug.apk
          if-no-files-found: error
