name: Build Jarvis Mobile APK

on:
  push:
    paths:
      - 'android/JarvisMobile/**'
      - '.github/workflows/build-jarvis-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/JarvisMobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Patch Compose for Kotlin 2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('build.gradle.kts')
          txt = root.read_text()
          if 'org.jetbrains.kotlin.plugin.compose' not in txt:
              txt = txt.replace(
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
              )
              root.write_text(txt)

          app = Path('app/build.gradle.kts')
          txt = app.read_text()
          if 'id("org.jetbrains.kotlin.plugin.compose")' not in txt:
              txt = txt.replace(
                  'id("org.jetbrains.kotlin.android")',
                  'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
              )
          txt = txt.replace('''\n    composeOptions {\n        kotlinCompilerExtensionVersion = "1.5.15"\n    }\n''', '\n')
          app.write_text(txt)
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Detect version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          txt = Path('app/build.gradle.kts').read_text()
          m = re.search(r'versionName\s*=\s*"([^"]+)"', txt)
          print(m.group(1) if m else 'unknown')
          PY
          )
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../../JarvisMobile-v${{ steps.version.outputs.name }}-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../JarvisMobile-debug.apk

      - name: Version APK in repository
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          cp JarvisMobile-debug.apk /tmp/JarvisMobile-debug.apk
          cp JarvisMobile-v${{ steps.version.outputs.name }}-debug.apk /tmp/JarvisMobile-versioned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --hard origin/master
          mkdir -p bin/android
          cp /tmp/JarvisMobile-debug.apk bin/android/JarvisMobile-debug.apk
          cp /tmp/JarvisMobile-versioned.apk bin/android/JarvisMobile-v${{ steps.version.outputs.name }}-debug.apk
          git add bin/android/
          if git diff --cached --quiet; then
            echo "APK sem alteracoes; nada para commitar."
          else
            git commit -m "Atualiza APK Jarvis Mobile v${{ steps.version.outputs.name }} [skip ci]"
            git push origin HEAD:master
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisMobile-v${{ steps.version.outputs.name }}-debug-apk
          path: JarvisMobile-v${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
