name: Build Casa Mobile APK
# build-trigger: 2.6.3-clean-ci

on:
  push:
    paths:
      - 'android/JarvisMobile/**'
      - '.github/workflows/build-jarvis-mobile.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repository-hygiene:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Android Studio and Gradle caches from Git index
        shell: bash
        run: |
          git rm -r --cached --ignore-unmatch android/JarvisMobile/.gradle android/JarvisMobile/.idea
          git rm --cached --ignore-unmatch android/JarvisMobile/local.properties
          while IFS= read -r -d '' dir; do
            git rm -r --cached --ignore-unmatch -- "$dir"
          done < <(find android/JarvisMobile -type d -name build -print0 2>/dev/null)

          while IFS= read -r -d '' artifact; do
            git rm --cached --ignore-unmatch -- "$artifact"
          done < <(git ls-files -z '*.apk' '*.deb' 2>/dev/null)

          if git diff --cached --quiet; then
            echo "Repositorio ja esta limpo."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove caches Android/Gradle versionados [skip ci]"
          git push origin HEAD:master

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/JarvisMobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-mobile-debug-keystore-v1

      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Detect version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          txt = Path('app/build.gradle.kts').read_text()
          m = re.search(r'versionName\s*=\s*"([^"]+)"', txt)
          print(m.group(1) if m else 'unknown')
          PY
          )
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/CasaMobile-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasaMobile-v${{ steps.version.outputs.name }}-debug-apk
          path: CasaMobile-v${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error

      - name: Publish or update debug GitHub Release
        if: github.ref == 'refs/heads/master'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          TAG="jarvis-mobile-v${VERSION}-debug"
          ASSET="CasaMobile-v${VERSION}-debug.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "Casa Mobile v${VERSION} Debug" \
              --notes "Build automatizado de desenvolvimento do Casa Mobile v${VERSION}." \
              --prerelease
          fi

      # Só ativa a versão já indicada no manifesto, depois de publicar o APK.
      - name: Complete authorized mobile manifest after APK publication
        if: github.ref == 'refs/heads/master'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          git fetch origin master
          git checkout -B master origin/master
          python3 - <<'PYTHON'
          import hashlib, json, os, re
          from pathlib import Path
          path = Path('bin/versions.json')
          manifest = json.loads(path.read_text())
          entry = manifest['components'].get('casa-mobile-debug', {})
          version = os.environ['RELEASE_VERSION']
          apk = Path(f'CasaMobile-v{version}-debug.apk')
          code = int(re.search(r'versionCode\s*=\s*(\d+)', Path('android/JarvisMobile/app/build.gradle.kts').read_text()).group(1))
          # Não substitui uma indicação alterada durante a compilação.
          if entry.get('version') == version and entry.get('version_code') == code:
              entry['sha256'] = hashlib.sha256(apk.read_bytes()).hexdigest()
              entry['enabled'] = True
              path.write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          if ! git diff --quiet -- bin/versions.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bin/versions.json
            git commit -m 'Activate published authorized Casa Mobile APK [skip ci]'
            git push origin HEAD:master
          fi
