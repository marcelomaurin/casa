name: Build JARVIS Watch Firmware

on:
  push:
    paths:
      - 'arduino/lilygo_watch/jarvis_watch/**'
      - '.github/workflows/build-jarvis-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.14
        shell: bash
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Install LilyGO T-Watch library
        shell: bash
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git             "$HOME/Arduino/libraries/TTGO_TWatch_Library"

      - name: Compile JARVIS Watch
        shell: bash
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app,PSRAM=enabled \
            arduino/lilygo_watch/jarvis_watch
